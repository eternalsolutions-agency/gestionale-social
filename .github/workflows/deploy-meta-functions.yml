name: Deploy Meta Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/_shared/**"
      - "supabase/functions/meta-social-publish/**"
      - "supabase/functions/meta-social-scheduler/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-meta-functions.yml"

permissions:
  contents: read

concurrency:
  group: deploy-meta-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: tkjajqizdjaynslvwcfp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN GitHub secret is missing."
            exit 1
          fi

      - name: Deploy meta-social-publish
        run: supabase functions deploy meta-social-publish --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy meta-social-scheduler
        run: supabase functions deploy meta-social-scheduler --project-ref "$SUPABASE_PROJECT_ID"
